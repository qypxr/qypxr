<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#11161F" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0" />
      <stop offset="30%" stop-color="#7C5CFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#8A6BFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8A6BFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="holeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#000000" stop-opacity="1" />
      <stop offset="52%" stop-color="#7C5CFF" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#8A6BFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Сетка глубокого космоса -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#161B22" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Фон и геометрическая сетка -->
  <rect width="900" height="260" rx="12" fill="url(#bgGrad)" stroke="#161B22" stroke-width="2" />
  <rect width="900" height="260" rx="12" fill="url(#grid)" opacity="0.6" />

  <!-- Звёзды с резким переключением яркости и масштаба -->
  <g fill="#FFFFFF">
    <circle cx="65" cy="40" r="1.5">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="195" cy="55" r="2" fill="#8A6BFF">
      <animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="215" r="1.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="285" cy="200" r="2" fill="#7C5CFF">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="635" cy="45" r="2" fill="#8A6BFF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="755" cy="65" r="1.5">
      <animate attributeName="opacity" values="1;0.1;1" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="695" cy="215" r="1.5">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="835" cy="195" r="2" fill="#7C5CFF">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Левый изометрический 3D-куб с открытыми гранями (левитирует) -->
  <g transform="translate(110, 125)">
    <animateTransform attributeName="transform" type="translate" values="110,120; 110,134; 110,120" dur="4s" repeatCount="indefinite" />
    <!-- Верхняя грань -->
    <polygon points="0,-28 24,-14 0,0 -24,-14" fill="#161B22" stroke="#7C5CFF" stroke-width="1.5" />
    <!-- Левая грань -->
    <polygon points="-24,-14 0,0 0,28 -24,14" fill="#0D1117" stroke="#7C5CFF" stroke-width="1.5" />
    <!-- Правая грань (открытая с внутренним каркасом) -->
    <polygon points="0,0 24,-14 24,14 0,28" fill="none" stroke="#8A6BFF" stroke-width="1.5" stroke-dasharray="4,2" />
    <line x1="0" y1="0" x2="12" y2="7" stroke="#7C5CFF" stroke-width="1" opacity="0.6" />
  </g>

  <!-- Правый изометрический 3D-куб с открытыми гранями (левитирует в противофазе) -->
  <g transform="translate(790, 125)">
    <animateTransform attributeName="transform" type="translate" values="790,134; 790,120; 790,134" dur="4s" repeatCount="indefinite" />
    <polygon points="0,-28 24,-14 0,0 -24,-14" fill="#161B22" stroke="#8A6BFF" stroke-width="1.5" />
    <polygon points="-24,-14 0,0 0,28 -24,14" fill="none" stroke="#7C5CFF" stroke-width="1.5" stroke-dasharray="4,2" />
    <polygon points="0,0 24,-14 24,14 0,28" fill="#0D1117" stroke="#8A6BFF" stroke-width="1.5" />
  </g>

  <!-- Вращающиеся гексагоны -->
  <g>
    <polygon points="230,65 240,59 250,65 250,77 240,83 230,77" fill="none" stroke="#7C5CFF" stroke-width="1.2" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 240 71" to="360 240 71" dur="18s" repeatCount="indefinite" />
    </polygon>
    <polygon points="650,180 662,173 674,180 674,194 662,201 650,194" fill="none" stroke="#8A6BFF" stroke-width="1.2" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="360 662 187" to="0 662 187" dur="15s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- ЦЕНТРАЛЬНАЯ ЧЁРНАЯ ДЫРА (Вращающиеся орбитальные контуры) -->
  <g transform="translate(450, 125)">
    <!-- Гравитационное гало -->
    <circle cx="0" cy="0" r="105" fill="url(#holeGlow)" />

    <!-- Внешнее орбитальное кольцо (вращается по часовой) -->
    <g>
      <circle cx="0" cy="0" r="92" fill="none" stroke="#7C5CFF" stroke-width="1.5" stroke-dasharray="28 14 8 14" opacity="0.7" />
      <circle cx="92" cy="0" r="3" fill="#8A6BFF" />
      <circle cx="-92" cy="0" r="3" fill="#8A6BFF" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
    </g>

    <!-- Среднее кольцо аккреции (вращается против часовой быстрее) -->
    <g>
      <circle cx="0" cy="0" r="76" fill="none" stroke="#8A6BFF" stroke-width="2" stroke-dasharray="55 25" opacity="0.85" />
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite" />
    </g>

    <!-- Внутреннее фотонное кольцо (быстрое вращение) -->
    <g>
      <circle cx="0" cy="0" r="61" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="18 35" opacity="0.9" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </g>

    <!-- Чёрная сфера (Горизонт событий) -->
    <circle cx="0" cy="0" r="54" fill="#05070A" stroke="#7C5CFF" stroke-width="2" />
    <circle cx="0" cy="0" r="50" fill="#000000" />

    <!-- Горизонтальный луч аккреционного диска (пульсирует по ширине) -->
    <ellipse cx="0" cy="0" rx="195" ry="12" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" transform="rotate(-5)">
      <animate attributeName="rx" values="185;210;185" dur="3s" repeatCount="indefinite" />
    </ellipse>
    <line x1="-230" y1="0" x2="230" y2="0" stroke="url(#purpleGrad)" stroke-width="2" transform="rotate(-5)" />
  </g>

  <!-- Главный ник и чистая подпись -->
  <text x="455" y="138" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="10" text-anchor="middle">QYPXR</text>
  <text x="452" y="238" font-family="Consolas, monospace" font-weight="600" font-size="12" fill="#7C5CFF" letter-spacing="4" text-anchor="middle">C++ DEVELOPER // WINDOWS DESKTOP</text>
</svg>
